<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exploration Intelligence — MineOS AI</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/exploration.css" />
</head>
<body>

  <div id="map"></div>
<div class="shell">
  <aside class="sidebar" id="app-shell-sidebar"></aside>
  <header class="topbar" id="app-shell-topbar"></header>

  <main class="main">
    <div class="page-header">
      <h1>Exploration Intelligence</h1>
    </div>

    <div class="exploration-layout">
      <div class="panel panel--flush">
        <div class="map-panel" id="exp-map"></div>
      </div>
      <div class="panel">
        <div class="section-title">
          <span>Reserve-zones <span class="count" id="zone-count"></span></span>
          <button class="zone-list__toggle" id="zone-list-toggle" type="button" aria-expanded="false" aria-controls="zone-list">Show</button>
        </div>
        <div id="zone-list" hidden></div>
      </div>
    </div>
  </main>
</div>

<script src="js/data/mock/reserves.js"></script>
<script src="js/services/api.js"></script>
<script src="js/components/mapPanel.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/exploration.js"></script>
</body>
</html>
